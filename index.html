<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Factor Studio ‧ Sviluppo WordPress Professionale</title>
    <meta
      name="description"
      content="Sviluppo progetti WordPress con il metodo Sine Nebula: pianificazione documentata, aggiornamenti costanti e codice comprensibile."
    />
  </head>
  <body>
    <!-- prettier-ignore -->
    {{> header}}

    <main>
      <!-- prettier-ignore -->
      {{> intro}}
      <!-- prettier-ignore -->
      {{> explanation}}
      <!-- prettier-ignore -->
      {{> promise }}
      <!-- prettier-ignore -->
      {{> method }}
      <!-- prettier-ignore -->
      {{> background}}
      <!-- prettier-ignore -->
      {{> mute type="wings-down" s="var(--color-primary)" bg="var(--color-secondary)"}}
      <!-- prettier-ignore -->
      {{> hire-me}}
    </main>

    <!-- prettier-ignore -->
    {{> footer}}

    <!-- prettier-ignore -->
    {{> offcanvas}}
    <!-- prettier-ignore -->
    {{> cursor}}

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
